<style>
/* Layout: full-screen WebGL space scene; arcade text layers pinned over it; nothing scrolls */
:root {
  --space: #04050b;
  --text: #f4ead0;
  --dim: #8f8a7a;
  --gold-hi: #fff2b0;
  --gold: #ffc83d;
  --gold-lo: #a86a12;
  --glass: rgba(10, 11, 20, 0.66);
  --line: rgba(255, 200, 61, 0.28);
  --pixel: "Press Start 2P", "Courier New", monospace;
  --term: "VT323", "Courier New", monospace;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
body { background: var(--space); color: var(--text); font-family: var(--term); touch-action: none; -webkit-user-select: none; user-select: none; }

#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
#stage.pointer { cursor: pointer; }
#stage.grab { cursor: grabbing; }

.layer { position: fixed; inset: 0; pointer-events: none; transition: opacity .6s ease; }
.layer.off { opacity: 0; }

/* Intro: arcade attract screen */
.attract-top, .attract-bottom { position: absolute; left: 20px; right: 20px; display: flex; justify-content: space-between; gap: 12px; font-family: var(--pixel); font-size: clamp(9px, 1.4vw, 13px); letter-spacing: .08em; }
.attract-top { top: calc(22px + env(safe-area-inset-top, 0px)); }
.attract-bottom { bottom: calc(22px + env(safe-area-inset-bottom, 0px)); color: var(--dim); }
.attract-top .p1 { color: #ff5a7a; }
.attract-top .p2 { color: #46e3ff; }
.attract-top b { color: var(--gold); font-weight: 400; }
.attract-center { position: absolute; left: 16px; right: 16px; bottom: 19%; text-align: center; }
.press { margin: 0; font-family: var(--pixel); font-weight: 400; font-size: clamp(20px, 5vw, 48px); line-height: 1.2; letter-spacing: .04em;
  background: linear-gradient(180deg, var(--gold-hi) 0%, var(--gold) 46%, var(--gold-lo) 54%, #ffd76a 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 4px 0 #5a3300) drop-shadow(0 0 18px rgba(255, 200, 61, .45));
  animation: blink 1.1s steps(1) infinite; }
.attract-center p { margin: 18px 0 0; font-family: var(--pixel); font-size: clamp(9px, 1.5vw, 13px); color: var(--text); letter-spacing: .12em; }
@keyframes blink { 50% { opacity: 0; } }

/* HUD while the camera is on */
.hud-top { position: absolute; top: calc(18px + env(safe-area-inset-top, 0px)); left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: flex-start; font-family: var(--pixel); font-size: 11px; letter-spacing: .08em; }
.hud-top .brand { color: var(--gold); }
.hud-top .brand small { display: block; margin-top: 8px; color: var(--dim); font-size: 9px; }
.hud-hint { position: absolute; left: 16px; right: 16px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); text-align: center; font-size: 20px; color: var(--dim); }
.hud-hint kbd { font-family: var(--term); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; }
#zoom { pointer-events: auto; font: 10px/1 var(--pixel); letter-spacing: .06em; color: var(--text); background: var(--glass); border: 1px solid var(--line); border-radius: 6px; padding: 12px 12px; cursor: pointer; }
#zoom:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

#flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
#flash.go { animation: flash .5s ease-out; }
@keyframes flash { 0% { opacity: .9; } 100% { opacity: 0; } }

#fail { position: fixed; inset: 0; display: grid; place-items: center; padding: 0 16px; text-align: center; font-size: 22px; color: var(--dim); }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 600px) {
  .attract-top, .attract-bottom { left: 16px; right: 16px; }
  .hud-top { left: 16px; right: 16px; }
  .hud-hint { font-size: 17px; }
}
@media (prefers-reduced-motion: reduce) { .press { animation: none; } }

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(async function () {
  /* ================= Content (hobbies, cert year and social handles are PLACEHOLDERS: replace with real ones) ================= */
  const C = {
    name: 'DANIELE FASCIANI', age: 24,
    about: "I'm Daniele Fasciani and I'm 24. I write software for a living and lift heavy things for fun. I have more hobbies than free time, so this camera keeps them in one place.",
    hobbies: ['Powerlifting', 'Side projects at 2 a.m.', 'Espresso, no sugar', 'Video games, sci-fi books', 'Cooking pasta for the next PR'],
    work: 'I build web apps and back-end services, mostly in Python and TypeScript. I care about clean APIs, calm deployments and tests that catch real bugs.',
    stack: ['Python', 'Django', 'FastAPI', 'TypeScript', 'React', 'SQL', 'Docker', 'Git'],
    certs: [
      ['Anthropic Architect', 'CCAF-R', '2026', 'Anthropic']
    ],
    lifts: [['SQUAT', '212'], ['BENCH', '150'], ['DEADLIFT', '220']], total: '582', klass: 'RAW · -83 KG',
    socialText: 'On Instagram and TikTok I post motivational and training videos about my life as a worker and athlete.',
    week: ['MON  SQUAT     5x3 @ RPE 8', 'WED  BENCH     6x4 @ RPE 7', 'FRI  DEADLIFT  4x2 @ RPE 8.5'],
    contact: [['MAIL', 'hello@danielefasciani.dev'], ['INSTAGRAM', '@danielefasciani_pl'], ['TIKTOK', '@danielefasciani_pl']]
  };
  (function () {
    const s = document.getElementById('text-copy');
    const add = (tag, t) => { const e = document.createElement(tag); e.textContent = t; s.appendChild(e); };
    add('h2', 'About'); add('p', C.about); add('p', 'Hobbies: ' + C.hobbies.join(', '));
    add('h2', 'Work'); add('p', C.work); add('p', 'Stack: ' + C.stack.join(', '));
    add('h2', 'Certifications'); C.certs.forEach(c => add('p', c[0] + ' ' + c[1] + ', ' + c[3]));
    add('h2', 'Powerlifting'); add('p', C.klass + '. ' + C.lifts.map(l => l[0] + ' ' + l[1] + ' kg').join(', ') + ', total ' + C.total + ' kg');
    add('h2', 'Social'); add('p', C.socialText); add('h2', 'Contact'); C.contact.forEach(c => add('p', c[0] + ': ' + c[1]));
  })();

  const fail = (msg) => { const d = document.createElement('div'); d.id = 'fail'; d.textContent = msg; document.body.appendChild(d); document.getElementById('intro').classList.add('off'); };
  if (!window.THREE) { fail('The 3D library did not load. Check your connection and reload the page.'); return; }
  const canvas = document.getElementById('stage');
  let renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true }); }
  catch (e) { fail('This browser cannot show 3D graphics. Try a recent Chrome, Safari or Firefox.'); return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;

  await Promise.race([
    Promise.all(['24px "Press Start 2P"', '40px VT323', '30px Michroma'].map(f => document.fonts.load(f).catch(() => {}))),
    new Promise(r => setTimeout(r, 3000))
  ]);

  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const P2 = '"Press Start 2P", monospace', VT = 'VT323, monospace';
  const col = (hex) => new THREE.Color(hex).convertSRGBToLinear();
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, k) => a + (b - a) * k;
  const easeOut = k => 1 - Math.pow(1 - k, 3);
  const easeInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
  const easeOutBack = k => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
  const easeInBack = k => { const c1 = 1.6, c3 = c1 + 1; return c3 * k * k * k - c1 * k * k; };
  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const maxAniso = renderer.capabilities.getMaxAnisotropy();
  function ctex(cv, opts) {
    const t = new THREE.CanvasTexture(cv); t.encoding = THREE.sRGBEncoding; t.anisotropy = maxAniso;
    if (opts && opts.repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(opts.repeat[0], opts.repeat[1]); }
    return t;
  }
  function mkCanvas(w, h) { const cv = document.createElement('canvas'); cv.width = w; cv.height = h; return [cv, cv.getContext('2d')]; }

  /* ================= Settings ================= */
  const settings = { dark: true, sound: true, grid: false, float: true };
  try { Object.assign(settings, JSON.parse(localStorage.getItem('df24-settings') || '{}')); } catch (e) {}
  const saveSettings = () => { try { localStorage.setItem('df24-settings', JSON.stringify(settings)); } catch (e) {} };

  /* ================= Sound ================= */
  let actx = null;
  function initAudio() { if (actx) return; try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  function tone(freq, dur, opt) {
    opt = opt || {};
    if (!settings.sound || !actx) return;
    const t0 = actx.currentTime + (opt.when || 0);
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = opt.type || 'square'; o.frequency.setValueAtTime(freq, t0);
    if (opt.to) o.frequency.exponentialRampToValueAtTime(opt.to, t0 + dur);
    g.gain.setValueAtTime(opt.vol || 0.05, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function noise(dur, vol) {
    if (!settings.sound || !actx) return;
    const n = Math.floor(actx.sampleRate * dur), buf = actx.createBuffer(1, n, actx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
    f.type = 'highpass'; f.frequency.value = 1800; g.gain.value = vol || 0.15;
    s.buffer = buf; s.connect(f).connect(g).connect(actx.destination); s.start();
  }
  const sfx = {
    coin() { tone(988, 0.08); tone(1319, 0.38, { when: 0.08 }); },
    click() { tone(1700, 0.03, { vol: 0.03 }); },
    move() { tone(660, 0.05, { vol: 0.04 }); },
    open() { tone(520, 0.06, { vol: 0.04 }); tone(780, 0.09, { when: 0.06, vol: 0.04 }); },
    toggle(on) { tone(on ? 880 : 440, 0.08, { vol: 0.04 }); },
    on() { tone(220, 0.5, { to: 880, type: 'triangle', vol: 0.06 }); },
    off() { tone(880, 0.45, { to: 110, type: 'triangle', vol: 0.06 }); },
    shutter() { noise(0.05, 0.2); setTimeout(() => noise(0.06, 0.14), 90); },
    morning() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.12, { when: i * 0.1, vol: 0.04 })); },
    night() { [784, 659, 523, 392].forEach((f, i) => tone(f, 0.22, { when: i * 0.22, type: 'triangle', vol: 0.05 })); }
  };

  /* ================= Scene ================= */
  const scene = new THREE.Scene();
  scene.background = col('#04050b');
  const view = new THREE.PerspectiveCamera(35, 1, 0.1, 200);

  // Studio-in-space environment for reflections on the camera and coin
  (function () {
    const env = new THREE.Scene();
    const [gcv, g] = mkCanvas(512, 256);
    const grd = g.createLinearGradient(0, 0, 0, 256);
    grd.addColorStop(0, '#2a2140'); grd.addColorStop(0.45, '#07080f'); grd.addColorStop(1, '#0c0716');
    g.fillStyle = grd; g.fillRect(0, 0, 512, 256);
    const sky = new THREE.Mesh(new THREE.SphereGeometry(20, 32, 16), new THREE.MeshBasicMaterial({ map: ctex(gcv), side: THREE.BackSide }));
    env.add(sky);
    const box = (w, h, c, k, pos, look) => {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(c).multiplyScalar(k), side: THREE.DoubleSide }));
      m.position.set(pos[0], pos[1], pos[2]); m.lookAt(look[0], look[1], look[2]); env.add(m);
    };
    box(10, 5, 0xfff1d6, 3.2, [0, 9, 6], [0, 0, 0]);      // warm softbox above front
    box(3, 12, 0xffd08a, 2.2, [-10, 1, 3], [0, 0, 0]);    // warm strip left
    box(3, 12, 0x6fd8ff, 1.6, [10, 1, -2], [0, 0, 0]);    // cyan rim right
    box(8, 3, 0xff4fb0, 1.0, [0, -6, -9], [0, 0, 0]);     // magenta kicker behind
    box(6, 6, 0xffffff, 1.4, [3, 3, 12], [0, 0, 0]);      // fill toward the viewer
    const pm = new THREE.PMREMGenerator(renderer);
    scene.environment = pm.fromScene(env, 0.03).texture;
    pm.dispose();
  })();

  scene.add(new THREE.AmbientLight(0xffffff, 0.08));
  const key = new THREE.DirectionalLight(0xfff0dc, 1.8); key.position.set(-3, 5, 6); scene.add(key);
  const rimC = new THREE.PointLight(0x46e3ff, 3.4, 14); rimC.position.set(4.5, 1.5, -3); scene.add(rimC);
  const rimM = new THREE.PointLight(0xff4fb0, 2.8, 14); rimM.position.set(-4.5, -1.5, -3); scene.add(rimM);

  /* ---------- Space backdrop ---------- */
  function radialTex(color, soft) {
    const [cv, c] = mkCanvas(256, 256);
    const g = c.createRadialGradient(128, 128, 0, 128, 128, 128);
    g.addColorStop(0, color); g.addColorStop(soft || 0.35, color.replace(/[\d.]+\)$/, '0.35)')); g.addColorStop(1, color.replace(/[\d.]+\)$/, '0)'));
    c.fillStyle = g; c.fillRect(0, 0, 256, 256);
    return ctex(cv);
  }
  const nebulae = [
    ['rgba(124,74,255,1)', [-22, 9, -48], 62, 0.55],
    ['rgba(255,60,172,1)', [24, -8, -52], 66, 0.42],
    ['rgba(43,210,255,1)', [8, 15, -60], 58, 0.38],
    ['rgba(255,190,80,1)', [-12, -14, -40], 34, 0.22],
    ['rgba(70,110,255,1)', [30, 13, -46], 46, 0.35],
    ['rgba(160,60,255,1)', [-34, -10, -55], 50, 0.35]
  ].map(([c, p, s, o]) => {
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: radialTex(c), blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, opacity: o }));
    sp.position.set(p[0], p[1], p[2]); sp.scale.set(s, s, 1); sp.userData.base = o; scene.add(sp); return sp;
  });

  const starGroup = new THREE.Group(); scene.add(starGroup);
  (function () {
    const N = 4200, rnd = rng(7);
    const pos = new Float32Array(N * 3), size = new Float32Array(N), phase = new Float32Array(N), color = new Float32Array(N * 3);
    const palette = [[1, 1, 1], [0.75, 0.85, 1], [1, 0.86, 0.55], [0.7, 0.95, 1], [1, 0.7, 0.9]];
    for (let i = 0; i < N; i++) {
      const u = rnd() * 2 - 1, th = rnd() * Math.PI * 2, r = 35 + rnd() * 60, s = Math.sqrt(1 - u * u);
      pos[i * 3] = r * s * Math.cos(th); pos[i * 3 + 1] = r * u; pos[i * 3 + 2] = r * s * Math.sin(th);
      size[i] = rnd() < 0.04 ? 9 + rnd() * 8 : 2 + rnd() * 4.5;
      phase[i] = rnd() * 6.283;
      const p = palette[(rnd() * palette.length) | 0]; color.set(p, i * 3);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('size', new THREE.BufferAttribute(size, 1));
    geo.setAttribute('phase', new THREE.BufferAttribute(phase, 1));
    geo.setAttribute('aColor', new THREE.BufferAttribute(color, 3));
    const mat = new THREE.ShaderMaterial({
      uniforms: { time: { value: 0 }, pr: { value: renderer.getPixelRatio() } },
      vertexShader: 'attribute float size; attribute float phase; attribute vec3 aColor; uniform float time; uniform float pr; varying vec3 vC; varying float vT;' +
        'void main(){ vec4 mv = modelViewMatrix * vec4(position,1.0); gl_Position = projectionMatrix * mv; vT = 0.6 + 0.4*sin(time*1.6 + phase); vC = aColor; gl_PointSize = size * pr * (0.75 + 0.25*vT) * (55.0 / -mv.z); }',
      fragmentShader: 'varying vec3 vC; varying float vT; void main(){ vec2 d = gl_PointCoord - 0.5; float r = length(d); float a = pow(smoothstep(0.5, 0.0, r), 1.8); float cross = max(0.0, 1.0 - abs(d.x)*14.0) * smoothstep(0.5,0.0,abs(d.y)) + max(0.0, 1.0 - abs(d.y)*14.0) * smoothstep(0.5,0.0,abs(d.x)); a = clamp(a + cross*0.35, 0.0, 1.0); gl_FragColor = vec4(vC * a * (0.7 + 0.6*vT), a); }',
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
    });
    starGroup.add(new THREE.Points(geo, mat));
    starGroup.userData.mat = mat;
  })();

  // Gold dust drifting close to the camera
  const dust = (function () {
    const N = 260, rnd = rng(19), pos = new Float32Array(N * 3), vel = new Float32Array(N);
    for (let i = 0; i < N; i++) { pos[i * 3] = (rnd() - .5) * 16; pos[i * 3 + 1] = (rnd() - .5) * 10; pos[i * 3 + 2] = -8 + rnd() * 12; vel[i] = 0.05 + rnd() * 0.15; }
    const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const [cv, c] = mkCanvas(64, 64); const g = c.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, 'rgba(255,230,160,1)'); g.addColorStop(.4, 'rgba(255,200,80,.5)'); g.addColorStop(1, 'rgba(255,200,80,0)'); c.fillStyle = g; c.fillRect(0, 0, 64, 64);
    const pts = new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.07, map: ctex(cv), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, color: 0xffd27a }));
    scene.add(pts); return { pts, pos, vel, N };
  })();

  /* ================= Materials ================= */
  const bodyMat = new THREE.MeshStandardMaterial({ color: col('#1e1e21'), metalness: 0.15, roughness: 0.62, envMapIntensity: 0.9 }); // matte black body
  const goldBrushed = new THREE.MeshStandardMaterial({ color: col('#e2a63e'), metalness: 1, roughness: 0.42, envMapIntensity: 1.1 });
  const accentMat = new THREE.MeshStandardMaterial({ color: col('#2a2a2e'), metalness: 0.5, roughness: 0.35, envMapIntensity: 1.1 }); // shutter + lens band
  const black = new THREE.MeshStandardMaterial({ color: col('#0b0b0f'), metalness: 0.3, roughness: 0.35 });
  const leather = (function () {
    const [cv, c] = mkCanvas(256, 256), rnd = rng(4);
    c.fillStyle = '#1a1714'; c.fillRect(0, 0, 256, 256);
    for (let i = 0; i < 5000; i++) { c.fillStyle = rnd() < .5 ? 'rgba(0,0,0,.35)' : 'rgba(255,230,190,.05)'; c.fillRect(rnd() * 256, rnd() * 256, 2, 2); }
    return new THREE.MeshStandardMaterial({ map: ctex(cv, { repeat: [3, 3] }), roughness: 0.85, metalness: 0.05 });
  })();
  const ridged = (function () {
    const [cv, c] = mkCanvas(256, 16);
    for (let x = 0; x < 256; x += 8) { c.fillStyle = '#f6c866'; c.fillRect(x, 0, 4, 16); c.fillStyle = '#7a4d12'; c.fillRect(x + 4, 0, 4, 16); }
    return new THREE.MeshStandardMaterial({ map: ctex(cv, { repeat: [6, 1] }), metalness: 1, roughness: 0.32 });
  })();
  const rubberRidged = (function () {
    const [cv, c] = mkCanvas(256, 16);
    for (let x = 0; x < 256; x += 8) { c.fillStyle = '#26221d'; c.fillRect(x, 0, 4, 16); c.fillStyle = '#0a0908'; c.fillRect(x + 4, 0, 4, 16); }
    return new THREE.MeshStandardMaterial({ map: ctex(cv, { repeat: [10, 1] }), roughness: 0.9 });
  })();

  /* ================= Geometry helpers ================= */
  function rrShape(w, h, r) {
    const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
    s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
    s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
    s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
    return s;
  }
  function rrBox(w, h, d, r, b) {
    const g = new THREE.ExtrudeGeometry(rrShape(w - 2 * b, h - 2 * b, r), { depth: d - 2 * b, bevelEnabled: true, bevelThickness: b, bevelSize: b, bevelSegments: 4, curveSegments: 12 });

  const GALLERY = C.certs.map(c => ({ kind: 'cert', title: c[0], code: c[1], year: c[2], issuer: c[3], icon: 'medal' }))

  function T(s, x, y, size, font, color, align) { sc.font = size + 'px ' + font; sc.fillStyle = color; sc.textAlign = align || 'left'; sc.fillText(s, x, y); }
  function wrap(s, x, y, maxW, lh, size, font, color) {
    sc.font = size + 'px ' + font; sc.fillStyle = color; sc.textAlign = 'left';
    let line = '';
    for (const w of s.split(' ')) { const t = line ? line + ' ' + w : w; if (sc.measureText(t).width > maxW && line) { sc.fillText(line, x, y); y += lh; line = w; } else line = t; }
    if (line) { sc.fillText(line, x, y); y += lh; }
    return y;
  }
  function pixelArt(rows, cx, cy, px, color, map) {
    const w = rows[0].length * px, h = rows.length * px, x0 = cx - w / 2, y0 = cy - h / 2;
    rows.forEach((r, j) => { for (let i = 0; i < r.length; i++) { const ch = r[i]; if (ch === '.') continue; sc.fillStyle = map ? (map[ch] || color) : color; sc.fillRect(x0 + i * px, y0 + j * px, px, px); } });
  }
  function tri(x, y, s, dir, color) { // dir: 1 down, -1 up, 2 right, -2 left
    sc.fillStyle = color; sc.beginPath();
    if (dir === 1) { sc.moveTo(x - s, y - s / 2); sc.lineTo(x + s, y - s / 2); sc.lineTo(x, y + s / 2); }
    else if (dir === -1) { sc.moveTo(x - s, y + s / 2); sc.lineTo(x + s, y + s / 2); sc.lineTo(x, y - s / 2); }
    else if (dir === 2) { sc.moveTo(x - s / 2, y - s); sc.lineTo(x - s / 2, y + s); sc.lineTo(x + s / 2, y); }
    else { sc.moveTo(x + s / 2, y - s); sc.lineTo(x + s / 2, y + s); sc.lineTo(x - s / 2, y); }
    sc.closePath(); sc.fill();
  }
  function brackets(x, y, w, h, len, color, lw) {
    sc.strokeStyle = color; sc.lineWidth = lw; sc.beginPath();
    [[x, y, 1, 1], [x + w, y, -1, 1], [x, y + h, 1, -1], [x + w, y + h, -1, -1]].forEach(([px, py, dx, dy]) => { sc.moveTo(px + dx * len, py); sc.lineTo(px, py); sc.lineTo(px, py + dy * len); });
    sc.stroke();
  }
  function clock() { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }

  function statusBar(title) {
    sc.fillStyle = TH.panel; sc.fillRect(0, 0, SW, 80);
    sc.strokeStyle = TH.gold; sc.lineWidth = 4; sc.strokeRect(28, 17, 60, 46); T('M', 58, 54, 28, P2, TH.gold, 'center');
    T('ISO 24', 118, 56, 48, VT, TH.fg); T('1/250', 262, 56, 48, VT, TH.fg); T('F1.8', 378, 56, 48, VT, TH.fg);
    T(title, SW / 2, 54, 26, P2, TH.gold, 'center');
    const bx = SW - 330; sc.strokeStyle = TH.fg; sc.lineWidth = 4; sc.strokeRect(bx, 24, 84, 34); sc.fillStyle = TH.fg; sc.fillRect(bx + 84, 33, 8, 16);
    for (let i = 0; i < 4; i++) { sc.fillStyle = TH.cyan; sc.fillRect(bx + 6 + i * 19, 30, 15, 22); }
    T('CR 01', SW - 36, 56, 48, VT, TH.gold, 'right');
  }
  function footer(hint) { sc.fillStyle = TH.panel; sc.fillRect(0, SH - 72, SW, 72); T(hint, 40, SH - 22, 42, VT, TH.dim); T(clock(), SW - 40, SH - 22, 42, VT, TH.dim, 'right'); }

  function drawHome(t) {
    statusBar('HOME');
    T(C.name, SW / 2, 230, 60, P2, TH.gold, 'center');
    T('DEVELOPER  ·  POWERLIFTER  ·  AGE ' + C.age, SW / 2, 306, 54, VT, TH.fg, 'center');
    const tiles = [['USER', 'ABOUT · WORK · CONTACT', 'user'], ['GALLERY', 'CERT · LIFTS · SOCIAL', 'gallery'], ['SETTINGS', 'DISPLAY · SOUND', 'settings']];
    const tw = 400, th = 460, gap = 48, x0 = (SW - (3 * tw + 2 * gap)) / 2, y0 = 388;
    tiles.forEach((tl, i) => {
      const x = x0 + i * (tw + gap), sel = i === S.homeSel, bob = sel ? Math.sin(t * 6) * 6 : 0;
      sc.fillStyle = sel ? TH.sel : TH.panel; sc.fillRect(x, y0, tw, th);
      sc.lineWidth = sel ? 8 : 3; sc.strokeStyle = sel ? TH.gold : TH.line; sc.strokeRect(x, y0, tw, th);
      pixelArt(PIX[tl[2]], x + tw / 2, y0 + 170 + bob, 14, sel ? TH.gold : TH.fg);
      T(tl[0], x + tw / 2, y0 + 340, 32, P2, sel ? TH.gold : TH.fg, 'center');
      T(tl[1], x + tw / 2, y0 + 404, 40, VT, TH.dim, 'center');
      if (sel && Math.floor(t * 2.5) % 2 === 0) tri(x + tw / 2, y0 - 26, 18, 1, TH.gold);
      hit(x, y0, tw, th, () => { S.homeSel = i; openScreen(tl[2]); });
    });
    footer('< >  SELECT     OK  OPEN');
  }

    tabs.forEach((n, i) => {

    M: ['#...#', '##.##', '#.#.#', '#...#', '#...#'], R: ['####.', '#...#', '####.', '#..#.', '#...#'], N: ['#...#', '##..#', '#.#.#', '#..##', '#...#'],
    I: ['#####', '..#..', '..#..', '..#..', '#####'], H: ['#...#', '#...#', '#####', '#...#', '#...#'], T: ['#####', '..#..', '..#..', '..#..', '..#..'],
    '!': ['..#..', '..#..', '..#..', '.....', '..#..'], '.': ['.....', '.....', '.....', '.....', '..#..'], Z: ['#####', '...#.', '..#..', '.#...', '#####'], ' ': ['.....', '.....', '.....', '.....', '.....']
  };

        for (let dy = 0; dy < size; dy++) for (let dx = 0; dx < size; dx++) gPx(x + (n * 6 + i) * size + dx, y + j * size + dy, v, a);

  // Gengar (upper body), defined in 56x48 sprite units and drawn at GS scale:
  // round body, big ears, spiky sides, short crest, slanted eyes with slit pupils, toothy grin
  const GG_W = 56, GG_H = 48, GS = 1.25;
  function triIn(px, py, a, b, c) {
    const s = (p1, p2, p3) => (p1[0] - p3[0]) * (p2[1] - p3[1]) - (p2[0] - p3[0]) * (p1[1] - p3[1]);
    const d1 = s([px, py], a, b), d2 = s([px, py], b, c), d3 = s([px, py], c, a);
    return !((d1 < 0 || d2 < 0 || d3 < 0) && (d1 > 0 || d2 > 0 || d3 > 0));

  function ggInside(px, py, armsUp) {
    if (px < 0 || py < 0 || px >= GG_W || py >= GG_H) return false;
    const m = px > 28 ? 56 - px : px;
    const el = (cx, cy, rx, ry) => ((px - cx) / rx) ** 2 + ((py - cy) / ry) ** 2 <= 1;
    if (el(28, 32, 22, 20) || el(28, 40, 24, 12)) return true;
    if (triIn(m, py, [0, 0], [7, 24], [20, 13])) return true;
    if (triIn(m, py, [3, 27], [8, 21], [9, 33]) || triIn(m, py, [5, 37], [8, 32], [10, 41])) return true;
    if (triIn(px, py, [22, 4], [18, 14], [26, 12]) || triIn(px, py, [29, 1], [25, 13], [34, 12]) || triIn(px, py, [36, 6], [32, 13], [40, 15])) return true;
    return armsUp ? triIn(m, py, [0, 8], [8, 30], [14, 22]) : triIn(m, py, [0, 46], [7, 33], [13, 41]);
  }
  // -1 transparent, 0 ink, 1 paper
  function ggColor(px, py, eyes, mouth, armsUp) {

    if (eyes === 'open') {

    } else if (mx >= 13 && mx <= 24.5 && Math.abs(py - (24.5 + 2 * Math.sin(Math.PI * (mx - 13) / 11))) < 0.85) return 1;

  function gengarState(type, k) {

    } else {

        const h = Math.max(6, SH * (1 - easeOut(k / 0.55))), top = SH / 2 - h / 2;
        sc.fillStyle = 'rgba(255,255,255,' + (0.7 * k / 0.55).toFixed(3) + ')'; sc.fillRect(0, top, SW, h);
        sc.fillStyle = '#000'; sc.fillRect(0, 0, SW, top); sc.fillRect(0, top + h, SW, SH - top - h); return;
      }
      sc.fillStyle = '#000'; sc.fillRect(0, 0, SW, SH);
      const q = (k - 0.55) / 0.45, w = Math.max(8, SW * (1 - easeOut(Math.min(1, q * 1.6))));
      sc.globalAlpha = 1 - Math.max(0, q - 0.6) / 0.4; sc.fillStyle = '#fff'; sc.fillRect(SW / 2 - w / 2, SH / 2 - 3, w, 6); sc.globalAlpha = 1;
    }
  }

  let screenMode = 'off', fx = null; // fx: {type:'on'|'off', t0, dur}
  function renderScreen(t, dt) {
    hits.length = 0; TH = settings.dark ? DARK : LIGHT;
    sc.save(); sc.textBaseline = 'alphabetic';
    if (screenMode === 'off') drawOff();
    else if (screenMode === 'boot') drawGengarClip('wake', (t - bootT0) / CLIP_DUR, t - bootT0);
    else if (screenMode === 'sleep') drawGengarClip('sleep', (t - sleepT0) / CLIP_DUR, t - sleepT0);
    else {
      sc.fillStyle = TH.bg; sc.fillRect(0, 0, SW, SH);
      S.slide *= Math.exp(-dt * 12); if (Math.abs(S.slide) < 0.5) S.slide = 0;
      ({ home: drawHome, user: drawUser, gallery: drawGallery, settings: drawSettings })[S.screen](t, dt);
      if (settings.grid) { sc.strokeStyle = TH.dim; sc.globalAlpha = .45; sc.lineWidth = 2; sc.beginPath(); [1, 2].forEach(i => { sc.moveTo(SW * i / 3, 80); sc.lineTo(SW * i / 3, SH - 72); sc.moveTo(0, SH * i / 3); sc.lineTo(SW, SH * i / 3); }); sc.stroke(); sc.globalAlpha = 1; }
      if (S.toast && t < S.toast.until) {
        const w = 760; sc.fillStyle = TH.panel; sc.fillRect(SW / 2 - w / 2, 110, w, 96); sc.strokeStyle = TH.gold; sc.lineWidth = 5; sc.strokeRect(SW / 2 - w / 2, 110, w, 96);
        T(S.toast.text, SW / 2, 172, 26, P2, TH.gold, 'center');
      }
      if (S.trans) {
        const k = (t - S.trans.t0) / 0.56;
        if (k >= 0.5 && !S.trans.swapped) { S.screen = S.trans.to; S.trans.swapped = true; S.slide = 0; }
        drawIris(easeInOut(k < 0.5 ? k / 0.5 : Math.max(0, 1 - (k - 0.5) / 0.5)));
        if (k >= 1) S.trans = null;
      }
    }
    if (screenMode === 'ui') { sc.globalAlpha = TH.scan; sc.drawImage(scanCv, 0, 0); sc.globalAlpha = 1; }
    if (fx) { const k = clamp((t - fx.t0) / fx.dur, 0, 1); crt(fx.type, k); }
    sc.restore();
    screenTex.needsUpdate = true;
  }

  /* ================= Navigation ================= */
  const now = () => performance.now() / 1000;
  function openScreen(name) {
    if (S.trans || name === S.screen) return;
    S.trans = { t0: now(), to: name, swapped: false }; sfx.open();
  }
  function setUserPage(i) { i = (i + 3) % 3; if (i === S.userPage) return; S.slide = (i > S.userPage ? 1 : -1) * SW * 0.5; S.userPage = i; sfx.move(); }
  function setGallery(i, dir) { i = (i + GALLERY.length) % GALLERY.length; if (i === S.gal) return; S.slide = dir * 500; S.gal = i; sfx.move(); }
  function toggleSetting(i) { const k = SETTINGS_ROWS[i][0]; settings[k] = !settings[k]; saveSettings(); if (k === 'sound' && settings.sound) initAudio(); sfx.toggle(settings[k]); }
  function nav(a) {
    const scr = S.trans ? S.trans.to : S.screen;
    if (S.trans) return;
    if (scr === 'home') {
      if (a === 'left' || a === 'up') { S.homeSel = (S.homeSel + 2) % 3; sfx.move(); }
      else if (a === 'right' || a === 'down') { S.homeSel = (S.homeSel + 1) % 3; sfx.move(); }
      else if (a === 'ok') openScreen(['user', 'gallery', 'settings'][S.homeSel]);
    } else if (scr === 'user') {
      if (a === 'left' || a === 'up') setUserPage(S.userPage - 1);
      else if (a === 'right' || a === 'down') setUserPage(S.userPage + 1);
    } else if (scr === 'gallery') {
      if (a === 'left' || a === 'up') setGallery(S.gal - 1, -1);
      else if (a === 'right' || a === 'down') setGallery(S.gal + 1, 1);
    } else if (scr === 'settings') {
      if (a === 'up') { S.setSel = (S.setSel + 3) % 4; sfx.move(); }
      else if (a === 'down') { S.setSel = (S.setSel + 1) % 4; sfx.move(); }
      else toggleSetting(S.setSel);
    }
  }
  function action(a) {
    if (mode !== 'on') return;
    const b = buttons.find(x => x.action === a); if (b) b.pressT = now();
    kick += 0.035;
    if (a === 'power') { powerOff(); return; }
    if (a === 'shutter') { takePhoto(); return; }
    sfx.click();
    if (a === 'home' || a === 'user' || a === 'gallery' || a === 'settings') { if (a !== 'home' && S.screen === 'home') S.homeSel = ['user', 'gallery', 'settings'].indexOf(a); openScreen(a); }
    else nav(a);
  }
  let shutterT = -9;
  function takePhoto() {
    shutterT = now(); sfx.shutter();
    const f = document.getElementById('flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
    S.shots += 1; S.toast = { text: 'SAVED DSC_' + String(S.shots).padStart(4, '0') + '.JPG', until: now() + 1.4 };
  }

  /* ================= Mode machine ================= */
  // intro -> arriving -> booting -> on -> shutting -> leaving -> intro
  let mode = 'intro', modeT0 = now(), bootT0 = 0, sleepT0 = 0, kick = 0;
  const BOOT_DUR = CLIP_DUR, ARRIVE_DUR = reduced ? 0.4 : 2.0, LEAVE_DUR = reduced ? 0.3 : 1.0;
  const introEl = document.getElementById('intro'), hudEl = document.getElementById('hud'), creditEl = document.getElementById('credit');
  rig.visible = false;
  const coinState = { t0: -9, launching: false, appearT0: now() };

  function start() {
    if (mode !== 'intro') return;
    initAudio(); if (actx && actx.state === 'suspended') actx.resume();
    sfx.coin(); creditEl.textContent = 'CREDIT 01';
    coinState.launching = true; coinState.t0 = now();
    mode = 'arriving'; modeT0 = now() + (reduced ? 0 : 0.45);
    setTimeout(() => introEl.classList.add('off'), 250);
    S.screen = 'home'; S.homeSel = 0; S.trans = null; screenMode = 'off'; fx = null;
  }
  function powerOff() {
    if (mode !== 'on') return;
    sfx.night(); mode = 'shutting'; modeT0 = sleepT0 = now(); screenMode = 'sleep'; S.trans = null; fx = null;
    hudEl.classList.add('off');
  }

  function updateMode(t) {
    const k = clamp((t - modeT0) / (mode === 'arriving' ? ARRIVE_DUR : mode === 'leaving' ? LEAVE_DUR : 1), 0, 1);
    if (mode === 'arriving') {
      rig.visible = t >= modeT0;
      const e = easeOut(k), r = easeOutBack(k);
      anim.px = lerp(-9, 0, e); anim.py = lerp(-2.4, 0, e); anim.pz = lerp(-7, 0, e); anim.s = 1;
      anim.ry = lerp(-Math.PI * 3, 0, r); anim.rx = lerp(0.7, 0, e); anim.rz = lerp(0.5, 0, e);
      if (k >= 1) { mode = 'booting'; modeT0 = t; screenMode = 'boot'; bootT0 = t; fx = { type: 'on', t0: t, dur: 0.5 }; sfx.on(); setTimeout(() => sfx.morning(), 1400); }
    } else if (mode === 'booting') {
      if (t - bootT0 >= BOOT_DUR) { mode = 'on'; screenMode = 'ui'; fx = null; S.trans = { t0: t - 0.28, to: 'home', swapped: true }; hudEl.classList.remove('off'); }
    } else if (mode === 'shutting') {
      if (!fx && t - modeT0 >= CLIP_DUR) { fx = { type: 'off', t0: t, dur: 0.6 }; sfx.off(); }
      if (t - modeT0 >= CLIP_DUR + 0.65) { mode = 'leaving'; modeT0 = t; screenMode = 'off'; fx = null; tone(330, 0.5, { to: 60, type: 'sawtooth', vol: 0.03 }); }
    } else if (mode === 'leaving') {
      const e = easeInBack(k);
      anim.ry = lerp(0, Math.PI * 4, easeInOut(k)); anim.s = Math.max(0.0001, 1 - e); anim.pz = lerp(0, -4, easeInOut(k)); anim.rx = lerp(0, -0.4, k);
      if (k >= 1) {
        mode = 'intro'; rig.visible = false; Object.assign(anim, { px: 0, py: 0, pz: 0, rx: 0, ry: 0, rz: 0, s: 1 });
        coinState.launching = false; coinState.appearT0 = t; creditEl.textContent = 'CREDIT 00';
        introEl.classList.remove('off');
      }
    }
  }
  const anim = { px: 0, py: 0, pz: 0, rx: 0, ry: 0, rz: 0, s: 1 };

  /* ================= View / resize ================= */
  let fitAll = 10, fitScreen = 6, zoomed = false, portrait = false;
  const zoomBtn = document.getElementById('zoom');
  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false); view.aspect = w / h; view.updateProjectionMatrix();
    portrait = view.aspect < 0.9; zoomBtn.hidden = !portrait; if (!portrait) zoomed = false;
    const vf = THREE.MathUtils.degToRad(view.fov), hf = 2 * Math.atan(Math.tan(vf / 2) * view.aspect);
    const fit = (wNeed, hNeed) => Math.max(hNeed / 2 / Math.tan(vf / 2), wNeed / 2 / Math.tan(hf / 2));
    fitAll = fit(4.5, 3.9); fitScreen = fit(2.3, 1.7);
  }
  window.addEventListener('resize', resize); resize();
  zoomBtn.addEventListener('click', () => { zoomed = !zoomed; zoomBtn.textContent = zoomed ? 'SHOW CAMERA' : 'ZOOM SCREEN'; });
  const camTarget = new THREE.Vector3(0, 0.15, 0), camTargetGoal = new THREE.Vector3();
  let camDist = fitAll;

  /* ================= Input ================= */
  const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
  function pick(x, y) {
    if (mode !== 'on') return null;
    ndc.set(x / window.innerWidth * 2 - 1, -(y / window.innerHeight) * 2 + 1);
    raycaster.setFromCamera(ndc, view);
    const h = raycaster.intersectObject(model, true)[0];
    if (!h) return null;
    if (h.object.userData.screen) return { screen: true, uv: h.uv };
    let o = h.object; while (o && o !== model) { if (o.userData.action) return { action: o.userData.action }; o = o.parent; }
    return { body: true };
  }
  function tapScreen(uv) {
    const x = uv.x * SW, y = (1 - uv.y) * SH;
    for (let i = hits.length - 1; i >= 0; i--) { const r = hits[i]; if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) { kick += 0.015; sfx.click(); r.fn(); return; } }
  }
  let down = null, drag = { y: 0, x: 0 }, pointer = { x: 0, y: 0 }, hovered = null;
  canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); down = { x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY, moved: false }; });
  canvas.addEventListener('pointermove', e => {
    pointer.x = e.clientX / window.innerWidth * 2 - 1; pointer.y = e.clientY / window.innerHeight * 2 - 1;
    if (down) {
      const dx = e.clientX - down.lx, dy = e.clientY - down.ly; down.lx = e.clientX; down.ly = e.clientY;
      if (!down.moved && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) down.moved = true;
      if (down.moved && mode === 'on') { drag.y += dx * 0.008; drag.x = clamp(drag.x + dy * 0.005, -0.7, 0.7); canvas.classList.add('grab'); }
      return;
    }
    if (e.pointerType === 'mouse') {
      const p = pick(e.clientX, e.clientY);
      hovered = p && p.action ? p.action : null;
      canvas.classList.toggle('pointer', mode === 'intro' || !!hovered || !!(p && p.screen));
    }
  });
  function up(e) {
    if (!down) return;
    const moved = down.moved; down = null; canvas.classList.remove('grab');
    if (moved || e.type !== 'pointerup') return;
    if (mode === 'intro') { start(); return; }
    const p = pick(e.clientX, e.clientY);
    if (!p) return;
    if (p.action) action(p.action);
    else if (p.screen && screenMode === 'ui') tapScreen(p.uv);
  }
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('pointerleave', () => { hovered = null; });
  window.addEventListener('keydown', e => {
    if (mode === 'intro' && (e.key === 'Enter' || e.key === ' ')) { start(); e.preventDefault(); return; }
    const map = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', Enter: 'ok', ' ': 'ok', Escape: 'home', Backspace: 'home', h: 'home', u: 'user', g: 'gallery', s: 'settings', p: 'power', c: 'shutter' };
    const a = map[e.key] || map[e.key.toLowerCase && e.key.toLowerCase()];
    if (a && mode === 'on') { action(a); e.preventDefault(); }
  });

  /* ================= Loop ================= */
  let last = now();
  function frame() {
    const t = now(), dt = Math.min(0.05, t - last); last = t;
    updateMode(t);

    // coin
    const cs = coinState;
    if (cs.launching) {
      const k = clamp((t - cs.t0) / 0.8, 0, 1);
      coin.rotation.y += dt * (6 + 30 * k);
      coin.position.set(0, 0.55 + 2.4 * easeOut(k), -6 * k * k);
      coin.scale.setScalar(Math.max(0.0001, 1 - k));
    } else {
      const a = clamp((t - cs.appearT0) / 0.7, 0, 1);
      coin.rotation.y += dt * 2.4;
      coin.position.set(0, 0.55 + Math.sin(t * 1.8) * 0.12, 0);
      coin.scale.setScalar(reduced ? 1 : Math.max(0.0001, easeOutBack(a)));
    }
    coin.visible = coin.scale.x > 0.001;
    coinHalo.position.copy(coin.position); coinHalo.position.z -= 0.3;
    coinHalo.material.opacity = coin.visible ? (0.32 + 0.12 * Math.sin(t * 3)) * coin.scale.x : 0;

    // camera rig
    const fl = settings.float && !reduced ? 1 : 0;
    rig.position.set(anim.px, anim.py + fl * Math.sin(t * 0.9) * 0.08, anim.pz);
    rig.rotation.z = anim.rz + fl * Math.sin(t * 0.6) * 0.02;
    rig.scale.setScalar(anim.s);
    if (!down || !down.moved) { drag.y *= Math.exp(-dt * 2.5); drag.x *= Math.exp(-dt * 2.5); }
    kick *= Math.exp(-dt * 9);
    const par = mode === 'on' && !zoomed ? 1 : 0;
    spinner.rotation.set(anim.rx + drag.x + kick + par * pointer.y * 0.06 + 0.08, anim.ry + drag.y + par * pointer.x * 0.12 + fl * Math.sin(t * 0.5) * 0.03, 0);
    powerBtn.ring.material.color.setHex(mode === 'booting' || mode === 'on' ? 0x3cff6a : 0xd8243f);
    led.material.color.setHex(mode === 'booting' ? (Math.floor(t * 8) % 2 ? 0x3cff6a : 0x1a2a1a) : mode === 'on' ? 0x3cff6a : 0x1a2a1a);
    for (const b of buttons) {
      const k = clamp((t - b.pressT) / 0.2, 0, 1), depth = Math.sin(Math.PI * k) * 0.028;
      b.group.position.z = b.baseZ - depth;
      b.mat.emissive.setHex(b.action === hovered ? 0x3a2200 : 0x000000);
    }
    { const k = clamp((t - shutterT) / 0.2, 0, 1); shutter.position.y = shutter.userData.baseY - Math.sin(Math.PI * k) * 0.035; }

    // view framing
    const zoomIn = zoomed && mode === 'on', dGoal = zoomIn ? fitScreen : fitAll;
    if (zoomIn) camTargetGoal.set(SCX, SCY, 0); else camTargetGoal.set(0, 0.15, 0);
    camTarget.lerp(camTargetGoal, 1 - Math.exp(-dt * 5)); camDist = lerp(camDist, dGoal, 1 - Math.exp(-dt * 5));
    const ox = mode === 'on' ? pointer.x * 0.25 : 0, oy = mode === 'on' ? -pointer.y * 0.15 : 0;
    view.position.set(camTarget.x + ox, camTarget.y + 0.55 + oy, camTarget.z + camDist);
    view.lookAt(camTarget);

    // space
    starGroup.userData.mat.uniforms.time.value = t;
    starGroup.rotation.y += dt * 0.006; starGroup.rotation.x = Math.sin(t * 0.05) * 0.05;
    nebulae.forEach((n, i) => { n.material.opacity = n.userData.base * (0.85 + 0.15 * Math.sin(t * 0.3 + i)); n.material.rotation += dt * 0.01 * (i % 2 ? 1 : -1); });
    for (let i = 0; i < dust.N; i++) { dust.pos[i * 3 + 1] += dust.vel[i] * dt; dust.pos[i * 3] += Math.sin(t * 0.3 + i) * dt * 0.03; if (dust.pos[i * 3 + 1] > 5) dust.pos[i * 3 + 1] = -5; }
    dust.pts.geometry.attributes.position.needsUpdate = true;

    if (rig.visible) renderScreen(t, dt);
    renderer.render(scene, view);
    requestAnimationFrame(frame);
  }
  renderScreen(now(), 0);
  requestAnimationFrame(frame);
})();
</script>
